# Publish to PyPI when a release is published on GitHub (or by hand from the Actions tab).
# Uses PyPI's trusted publishing, so no token is stored here: on pypi.org the project's
# trusted publisher is this repository, this workflow file (publish.yml) and the
# environment "pypi".
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        # build_release.py points the README's pictures at GitHub for the PyPI page,
        # from the release tag when there is one.
        run: |
          python -m pip install --upgrade build twine
          REF="${GITHUB_REF_NAME:-main}"
          python scripts/build_release.py --ref "$REF"
          mkdir -p upload && cp dist/*/* upload/
          python -m twine check upload/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: upload/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
