[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pymations"
version = "0.2.0"
description = "Maths animations in Python, drawn in your web browser. Runs Manim Community scripts."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES"]
authors = [{ name = "John Wylie" }]
keywords = ["animation", "maths", "math", "manim", "explainer", "education", "latex", "pyodide"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "playwright>=1.40"]

[project.urls]
Homepage = "https://www.circuitry.dev/pymations"
Documentation = "https://github.com/johnwylie70/pymations/tree/main/docs"
Source = "https://github.com/johnwylie70/pymations"
Issues = "https://github.com/johnwylie70/pymations/issues"

[project.scripts]
pymations = "pymations.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pymations = ["_synced.json", "web/*.js", "web/engine/*", "web/engine/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
